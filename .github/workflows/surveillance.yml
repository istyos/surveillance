name: Surveillance du site
# Toutes les 15 minutes (GitHub peut décaler de quelques minutes). Un run en échec = mail de GitHub au propriétaire.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Adresse à tester (une adresse fausse sert à essayer l'alerte)"
        required: false
        default: "https://tracker.exploit-it.com/robots.txt"

permissions:
  contents: write

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
      - name: Garder la surveillance active
        # GitHub coupe les tâches planifiées d'un dépôt public après 60 jours sans activité : commit vide tous les 50 jours.
        if: github.event_name == 'schedule'
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$age" -gt $((50 * 86400)) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Maintien de la surveillance (sinon coupée après 60 jours sans activité)"
            git push
          fi
      - name: Le site répond-il ?
        env:
          URL: ${{ inputs.url || 'https://tracker.exploit-it.com/robots.txt' }}
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$URL" || true)
            if [ "$code" = "200" ]; then echo "OK : $URL répond (essai $i)"; exit 0; fi
            echo "essai $i : HTTP ${code:-000}"
            if [ "$i" -lt 3 ]; then sleep 45; fi
          done
          echo "::error title=Site injoignable::$URL ne répond plus (3 essais en 2 minutes)"
          exit 1
